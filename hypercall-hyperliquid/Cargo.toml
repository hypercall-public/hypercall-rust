[package]
name = "hypercall-hyperliquid"
version = "0.3.0"
edition = "2021"
description = "Direct Hyperliquid perp venue adapter for Hypercall SDK clients"
readme = "README.md"
license = "MIT"
homepage = "https://github.com/hypercall-public"
documentation = "https://docs.rs/hypercall-hyperliquid"
keywords = ["hypercall", "hyperliquid", "trading", "sdk"]
categories = ["api-bindings"]
include = ["Cargo.toml", "README.md", "src/**"]

[lints]
workspace = true

[package.metadata.cargo-machete]
# Intentional transitive compatibility constraint for the optional AWS signer.
ignored = ["aws-smithy-types"]

[dependencies]
alloy = { version = "1.5.2", default-features = false, features = ["eip712", "signer-local", "signers"] }
# This KMS feature can enable the AWS signer independently of hypercall-client/kms.
# Remove this bound with the matching client bound once AWS codecs support Smithy 1.7:
# https://github.com/awslabs/aws-sdk-rust/issues/1459
aws-smithy-types = { version = ">=1.5.0, <1.7.0", optional = true }
anyhow = "1"
hypercall-client = { path = "../hypercall-client", version = "0.3.0", default-features = false, features = ["alloy-rustls"], optional = true }
hypersdk = "=0.2.13"
rmp-serde = "1.3"
rust_decimal = "1.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
displaystr = "0.1.16"
url = { version = "2", optional = true }

[features]
default = ["venue"]
venue = ["dep:hypercall-client", "dep:url"]
aws-kms = ["venue", "alloy/signer-aws", "dep:aws-smithy-types"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
