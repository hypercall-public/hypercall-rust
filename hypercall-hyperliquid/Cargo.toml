[package]
name = "hypercall-hyperliquid"
version = "0.1.0"
edition = "2021"
description = "Direct Hyperliquid perp venue adapter for Hypercall SDK clients"
readme = "README.md"
license = "MIT"
homepage = "https://github.com/hypercall-public"
documentation = "https://docs.rs/hypercall-hyperliquid"
keywords = ["hypercall", "hyperliquid", "trading", "sdk"]
categories = ["api-bindings"]
include = ["Cargo.toml", "README.md", "src/**"]

[dependencies]
alloy = { version = "1.5.2", default-features = false, features = ["eip712", "signer-local", "signers"] }
hypercall-client = { path = "../hypercall-client", version = "0.1.0", default-features = false, features = ["alloy-rustls"], optional = true }
hypersdk = "=0.2.13"
rust_decimal = "1.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", optional = true }

[features]
default = ["venue"]
venue = ["dep:hypercall-client", "dep:url"]
aws-kms = ["venue", "alloy/signer-aws"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
